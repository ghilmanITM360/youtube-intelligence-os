name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Static safety checks
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          python scripts/scan_tracked_secrets.py
      - name: Validate canonical inventory catalog integrity
        run: |
          python -c "
          import sqlite3
          con = sqlite3.connect('data/catalog/youtube_inventory.db')
          integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
          violations = con.execute('PRAGMA foreign_key_check').fetchall()
          assert integrity == 'ok', f'integrity_check failed: {integrity}'
          assert not violations, f'foreign key violations: {violations}'
          print('canonical inventory catalog: integrity ok, 0 foreign key violations')
          "
      - name: Exercise partial catalog rebuilder against disposable database
        run: |
          python -m scripts.rebuild_inventory_catalog --database "$RUNNER_TEMP/bootstrap_inventory_catalog.db"
      - name: Build channel registry from committed canonical sources
        run: python -m scripts.build_youtube_channel_registry --write-ledgers
      - name: Validate provenance and registry
        run: |
          python -m scripts.validate_dataset_ledgers
          python -m scripts.validate_youtube_channel_registry
      - name: Run distributable suite
        run: python -m pytest -q
      - name: AI-slop risk gate on changed production scripts
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          git diff -z --name-only --diff-filter=AM "$BASE" HEAD -- productions | xargs -0 python scripts/check_slop_risk.py --only-scripts
      - name: Reject unapproved databases and generated junk
        run: |
          test -z "$(git ls-files 'data/catalog/*.db-wal' 'data/catalog/*.db-shm' 'outputs/**' '*.pyc')"
          UNAPPROVED_DBS="$(git ls-files '*.db' | grep -vFx -e 'data/catalog/youtube_inventory.db' -e 'data/catalog/youtube_channel_registry.db' || true)"
          test -z "$UNAPPROVED_DBS" || { echo "Unapproved tracked database(s):"; echo "$UNAPPROVED_DBS"; exit 1; }
