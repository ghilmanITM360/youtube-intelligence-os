name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Static safety checks
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          python scripts/scan_tracked_secrets.py
      - name: Validate canonical inventory catalog integrity
        run: |
          python -c "
          import sqlite3
          con = sqlite3.connect('data/catalog/youtube_inventory.db')
          integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
          violations = con.execute('PRAGMA foreign_key_check').fetchall()
          assert integrity == 'ok', f'integrity_check failed: {integrity}'
          assert not violations, f'foreign key violations: {violations}'
          print('canonical inventory catalog: integrity ok, 0 foreign key violations')
          "
      - name: Exercise partial catalog rebuilder against disposable database
        run: |
          python -m scripts.rebuild_inventory_catalog --database "$RUNNER_TEMP/bootstrap_inventory_catalog.db"
      # The frozen audit reads its pinned copy. These gates run first so that committed evidence is judged before any rebuild.
      - name: Finance and reference framework gates
        run: |
          python -m pytest -q research/finance-economics-intelligence/reference-framework/test_reference_comparison.py
          python -m pytest -q tests/test_packaging_rollup_reconciliation.py::test_current_rollups_reconcile_and_source_hashes_match
          python research/finance-economics-intelligence/reference-framework/reference_comparison.py check-all
          python research/finance-economics-intelligence/validate_audit_966.py
      - name: Build channel registry from committed canonical sources
        run: python -m scripts.build_youtube_channel_registry --write-ledgers
      - name: Validate provenance and registry
        run: |
          python -m scripts.validate_dataset_ledgers
          python -m scripts.validate_youtube_channel_registry
          python research/finance-economics-intelligence/validate_audit_966.py --current-registry
      - name: Run distributable suite
        # The pinned-hash rollup check already ran above, before the registry rebuild rewrites the DB.
        run: python -m pytest -q --deselect tests/test_packaging_rollup_reconciliation.py::test_current_rollups_reconcile_and_source_hashes_match
      - name: AI-slop risk gate on changed production scripts
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          git diff -z --name-only --diff-filter=AM "$BASE" HEAD -- productions | grep -zvxFf <(grep -v '^#' productions/.slop-gate-legacy.txt) | xargs -0 -r python scripts/check_slop_risk.py --only-scripts
      - name: Reject unapproved databases and generated junk
        run: |
          # -z: git quotes unusual paths otherwise, and a quoted name would slip past these anchors.
          TRACKED="$(git ls-files -z | tr '\0' '\n')"
          JUNK="$(echo "$TRACKED" | grep -iE '\.(db-wal|db-shm|db-journal|sqlite3?|pyc)$|^outputs/' || true)"
          test -z "$JUNK" || { echo "Tracked database sidecar or generated junk:"; echo "$JUNK"; exit 1; }
          UNAPPROVED_DBS="$(echo "$TRACKED" | grep -iE '\.db$' | grep -vFx -e 'data/catalog/youtube_inventory.db' -e 'data/catalog/youtube_channel_registry.db' -e 'data/knowledge/reference_knowledge.db' -e 'research/finance-economics-intelligence/audit-baseline/youtube_channel_registry.frozen.db' -e 'data/catalog/finance_economics_complete.db' -e 'data/catalog/senior_health/senior_health_core.db' -e 'data/catalog/senior_health/senior_health_transcripts_1.db' -e 'data/catalog/senior_health/senior_health_transcripts_2.db' -e 'data/catalog/senior_health/senior_health_transcripts_3.db' -e 'research/senior-health-apify-2026-11-11/senior_health_apify.db' || true)"
          test -z "$UNAPPROVED_DBS" || { echo "Unapproved tracked database(s):"; echo "$UNAPPROVED_DBS"; exit 1; }
