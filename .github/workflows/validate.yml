name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Static safety checks
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          python scripts/scan_tracked_secrets.py
      - name: Rebuild generated databases
        run: |
          python -m scripts.rebuild_inventory_catalog
          python -m scripts.build_youtube_channel_registry --write-ledgers
      - name: Validate provenance and registry
        run: |
          python -m scripts.validate_dataset_ledgers
          python -m scripts.validate_youtube_channel_registry
      - name: Run distributable suite
        run: python -m pytest -q
      - name: Reject tracked untracked-by-design databases and generated junk
        run: |
          test -z "$(git ls-files 'data/catalog/youtube_inventory.db' 'data/catalog/*.db-*' 'outputs/**' '*.pyc')"
