[project]
name = "youtube-intelligence-os"
version = "1.0.0"
description = "Evidence-traceable YouTube channel research and content intelligence tooling"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "Pillow>=12.0,<13",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
