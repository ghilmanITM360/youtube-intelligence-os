<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family:"ComicB"; src:url("assets/fonts/comic-bold.ttf"); font-weight:700; }
:root { --ink:#111; --red:#D7263D; --grey:#C4C4C4; --mint:#E4F5EA; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#fff; }
#root { position:relative; width:1080px; height:1920px; background:#fff; }
svg { position:absolute; inset:0; width:1080px; height:1920px; }
.l { fill:none; stroke:var(--ink); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.r { fill:none; stroke:var(--red); stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
.f { fill:#fff; stroke:var(--ink); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.g { fill:var(--grey); stroke:var(--ink); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.d { stroke-dasharray:1; stroke-dashoffset:1; }
.h, .sc { opacity:0; }
text { font-family:"ComicB", sans-serif; font-weight:700; fill:var(--ink); text-anchor:middle; }
text.red { fill:var(--red); }
#world text{visibility:hidden}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="98.33" data-width="1080" data-height="1920">
<audio id="vo" class="clip" src="assets/vo_full.wav" data-start="0" data-duration="98.33" data-track-index="9" data-volume="1"></audio>
<audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="98.33" data-track-index="8" data-volume="1"></audio>
<svg id="stage" class="clip" data-start="0" data-duration="98.33" data-track-index="1" viewBox="0 0 1080 1920"><g id="world"></g></svg>
</div>
<script src="scenes.js"></script>
</body>
</html>
