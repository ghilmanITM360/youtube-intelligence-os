<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YIOS Data Browser</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--mut:#5d6672;--line:#e1e5ea;--acc:#1f5eff;--acc-bg:#e8eeff;--ok:#17803d;--warn:#a15c00;--bad:#b42318;--bar:#9db7ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101316;--panel:#171b20;--ink:#e8ebef;--mut:#98a2ae;--line:#272d34;--acc:#7da2ff;--acc-bg:#1c2a4d;--ok:#4ac17a;--warn:#e0a13a;--bad:#f1796c;--bar:#35538f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:0 16px;overflow-x:auto}
header b{margin-right:14px;white-space:nowrap}
header a{padding:14px 12px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent}
header a.on{color:var(--ink);border-bottom-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .n{font-size:24px;font-weight:600}.card .l{color:var(--mut);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
th.s{cursor:pointer}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar i{display:block;height:10px;background:var(--bar);border-radius:3px}
.bar span{min-width:130px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc-bg);color:var(--acc);white-space:nowrap}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}.tag.grey{background:var(--line);color:var(--mut)}
.bar-f{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
input[type=search]{flex:1;min-width:180px}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:560px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.pg{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--mut)}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:18px;text-align:center}
.crumbs{margin:0 0 10px;color:var(--mut);font-size:13px}
img.pv{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.thumb{width:120px;border-radius:4px;display:block}
.ch{width:100%;height:auto;display:block}.ch rect{fill:var(--acc)}.ch rect.b2{fill:var(--bar)}.ch text{fill:var(--mut);font:10px sans-serif}.ch line{stroke:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.grid2 h2{margin-top:14px}
.md h2,.md h3,.md h4{margin:18px 0 6px}.md p{margin:8px 0}.md code{background:var(--bg);padding:1px 5px;border-radius:4px;font:13px ui-monospace,Menlo,monospace}.md blockquote{margin:8px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--mut)}.md li{margin:2px 0}.md hr{border:0;border-top:1px solid var(--line)}
.tbl{max-height:640px;overflow:auto}.tbl th{position:sticky;top:0;background:var(--panel)}.tbl td{max-width:420px;word-break:break-word}
.jt details{margin-left:16px}.jt summary{cursor:pointer;list-style-position:outside}.jt .k{color:var(--acc)}.jt .v{margin-left:16px;word-break:break-word}.jt{font:13px/1.6 ui-monospace,Menlo,monospace}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0}.seg button.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
@media (max-width:640px){main{padding:14px 12px 50px}.hide-s{display:none}}
</style>
</head>
<body>
<header id="nav"><b>YIOS</b></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const NAV = [["#/", "Overview"], ["#/channels", "Channels"], ["#/videos", "Videos"], ["#/artifacts", "Analyses & files"], ["#/quality", "Data quality"]];
const num = n => n == null ? "–" : Number(n).toLocaleString();
const dur = s => { if (s == null) return "–"; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
// h() builds DOM nodes; text is always set as text, never as HTML (descriptions and transcripts are untrusted).
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; k === "class" ? e.className = v : k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const A = (href, ...k) => h("a", { href }, ...k);
const tag = (t, c) => h("span", { class: "tag " + (c || "") }, t);
async function api(p) { const r = await fetch(p); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }
function route() {
  const raw = location.hash.slice(1) || "/"; const [path, qs] = raw.split("?"); const q = Object.fromEntries(new URLSearchParams(qs || ""));
  return { path, q, parts: path.split("/").filter(Boolean) };
}
function qs(o) { const u = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v) u.set(k, v); const s = u.toString(); return s ? "?" + s : ""; }
function bars(rows, label, val, link) {
  const max = Math.max(...rows.map(r => r[val]), 1);
  return h("div", {}, rows.map(r => h("div", { class: "bar" }, h("span", {}, link ? A(link(r), r[label] ?? "(none)") : r[label] ?? "(none)"), h("i", { style: `width:${Math.max(2, r[val] / max * 260)}px` }), num(r[val]))));
}
function table(cols, data, empty) {
  if (!data.length) return h("div", { class: "empty" }, empty || "Nothing here.");
  return h("table", {}, h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: c.r ? "r" : "" }, c.h)))), h("tbody", {}, data.map(d => h("tr", {}, cols.map(c => h("td", { class: (c.r ? "r " : "") + (c.cls || "") }, c.f(d)))))));
}


// ---- charts (inline SVG, no libraries) ----
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k))); return e; }
const short = n => n == null ? "" : n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K" : String(Math.round(n));
// column chart: pts = [{l: label, v: value}]; thin = show every n-th x label
function columns(pts, { w = 560, hgt = 170, thin = 1, name = "" } = {}) {
  if (!pts.length) return h("div", { class: "empty" }, "No data.");
  const L = 38, B = 22, T = 8, max = Math.max(...pts.map(p => p.v), 1), bw = (w - L) / pts.length, ph = hgt - B - T;
  const svg = sv("svg", { viewBox: `0 0 ${w} ${hgt}`, class: "ch", role: "img", "aria-label": name });
  for (const f of [0, .5, 1]) { const y = T + ph * (1 - f); svg.append(sv("line", { x1: L, x2: w, y1: y, y2: y }), sv("text", { x: L - 4, y: y + 3, "text-anchor": "end" }, short(max * f))); }
  pts.forEach((p, i) => { const bh = p.v / max * ph, x = L + i * bw; svg.append(sv("rect", { x: x + bw * .12, y: T + ph - bh, width: Math.max(1, bw * .76), height: bh }, sv("title", {}, `${p.l}: ${num(p.v)}`)));
    if (i % thin === 0) svg.append(sv("text", { x: x + bw / 2, y: hgt - 7, "text-anchor": "middle" }, p.l)); });
  return svg;
}
const panel = (...k) => h("div", { class: "panel" }, ...k);
const kcard = (n, l) => h("div", { class: "card" }, h("div", { class: "n" }, n), h("div", { class: "l" }, l));

// ---- file viewers ----
function inline(s) {

    if (m[1]) out.push(h("code", {}, t.slice(1, -1))); else if (m[2]) out.push(h("b", {}, inline(t.slice(2, -2)))); else if (m[3]) out.push(h("i", {}, inline(t.slice(1, -1))));
    else { const [, l, u] = t.match(/\[([^\]]+)\]\(([^)\s]+)\)/); out.push(/^https?:\/\//.test(u) ? h("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, l) : l); }
    i = re.lastIndex; }

}
const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
const isBlock = l => /^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+\.)\s+)/.test(l) || /^\s*([-*_])\s*(\1\s*){2,}$/.test(l);
function md(src) {  // small markdown renderer; builds DOM nodes only, so file content can never inject HTML
  const L = src.replace(/\r/g, "").split("\n"), out = []; let i = 0;
  if (L[0] === "---") { const e = L.indexOf("---", 1); if (e > 0) { out.push(h("pre", {}, L.slice(1, e).join("\n"))); i = e + 1; } }
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(h("pre", {}, b.join("\n"))); }
    else if ((m = l.match(/^(#{1,6})\s+(.*)/))) { out.push(h("h" + Math.min(m[1].length + 1, 6), {}, inline(m[2]))); i++; }
    else if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(l)) { out.push(h("hr")); i++; }
    else if (/^\s*>/.test(l)) { const b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, "")); out.push(h("blockquote", {}, md(b.join("\n")))); }
    else if (l.includes("|") && /^\s*\|?\s*:?-{2,}/.test(L[i + 1] || "")) { const head = cells(l), body = []; i += 2; while (i < L.length && L[i].includes("|")) body.push(cells(L[i++]));
      out.push(h("div", { class: "tbl" }, h("table", {}, h("thead", {}, h("tr", {}, head.map(x => h("th", {}, inline(x))))), h("tbody", {}, body.map(r => h("tr", {}, r.map(x => h("td", {}, inline(x))))))))); }
    else if (/^\s*([-*+]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && (/^\s*([-*+]|\d+\.)\s+/.test(L[i]) || (/^\s+\S/.test(L[i]) && items.length))) { const x = L[i++], mm = x.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
        if (mm) items.push(h("li", { style: `margin-left:${Math.min(mm[1].length, 12) * 8}px` }, inline(mm[3]))); else items[items.length - 1].append(" ", ...inline(x.trim())); }

  }

}
function csvParse(t, max) {
  const d = (t.slice(0, t.indexOf("\n") + 1).split("\t").length > t.slice(0, t.indexOf("\n") + 1).split(",").length) ? "\t" : ",", rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f.replace(/\r$/, "")); rows.push(row); row = []; f = ""; if (rows.length >= max) return { rows, more: true }; } else f += c; }

}
// sortable, filterable grid (shows at most 500 matching rows)
function grid(head, data, note) {
  let sort = null, dir = 1, qf = ""; const wrap = h("div", {}), body = h("div", { class: "tbl" }), cnt = h("span", { class: "mut" });
  const draw = () => {
    let r = data; if (qf) r = r.filter(x => x.some(c => String(c ?? "").toLowerCase().includes(qf)));
    if (sort != null) r = [...r].sort((a, b) => { const x = a[sort], y = b[sort], nx = parseFloat(x), ny = parseFloat(y); return (isNaN(nx) || isNaN(ny) ? String(x ?? "").localeCompare(String(y ?? "")) : nx - ny) * dir; });
    cnt.textContent = num(r.length) + " of " + num(data.length) + " rows" + (r.length > 500 ? " (first 500 shown)" : "") + (note ? " · " + note : "");
    const t = h("table", {}, h("thead", {}, h("tr", {}, head.map((c, i) => h("th", { class: "s", onclick: () => { dir = sort === i ? -dir : 1; sort = i; draw(); } }, c + (sort === i ? (dir > 0 ? " ▲" : " ▼") : ""))))),
      h("tbody", {}, r.slice(0, 500).map(x => h("tr", {}, head.map((_, i) => h("td", {}, x[i] == null ? "" : typeof x[i] === "object" ? JSON.stringify(x[i]).slice(0, 160) : String(x[i])))))));
    body.replaceChildren(t);
  };
  wrap.append(h("div", { class: "bar-f" }, h("input", { type: "search", placeholder: "Filter rows", oninput: e => { qf = e.target.value.toLowerCase(); draw(); } }), cnt), body); draw(); return wrap;
}
function jtree(v, key, open) {

  const arr = Array.isArray(v), ents = arr ? v.map((x, i) => [i, x]) : Object.entries(v), d = h("details", {}, h("summary", {}, label, arr ? `[${ents.length}]` : `{${ents.length}}`));

const looksTabular = a => Array.isArray(a) && a.length > 0 && a.slice(0, 20).every(x => x && typeof x === "object" && !Array.isArray(x));
function jsonView(j) {

    const keys = [...new Set(j.slice(0, 200).flatMap(Object.keys))].slice(0, 40); return grid(keys, j.map(r => keys.map(k => r[k])));
  };
  if (!looksTabular(j)) return mk();
  let mode = "table"; const box = h("div", {}), btn = (m, t) => h("button", { class: mode === m ? "on" : "", onclick: () => { mode = m; show(); } }, t);
  const show = () => { box.replaceChildren(h("div", { class: "seg bar-f" }, btn("table", "Table"), btn("tree", "Tree")), mode === "table" ? mk() : h("div", { class: "jt" }, jtree(j, null, true))); }; show(); return box;
}
function renderFile(a, text) {

}

// ---- pages ----
async function pOverview() {
  const s = await api("/api/summary");
  const card = (n, l) => h("div", { class: "card" }, h("div", { class: "n" }, num(n)), h("div", { class: "l" }, l));
  return [h("h1", {}, "YIOS data browser"), h("p", { class: "sub" }, "One de-duplicated catalogue built from five source databases. Nothing here edits the raw evidence."),
    h("div", { class: "cards" }, card(s.channels, "channels"), card(s.videos, "unique videos"), card(s.source_rows, "source rows merged"), card(s.transcripts, "transcripts"), card(s.artifacts, "files inventoried"), card(s.conflicts + s.quality_issues, "conflicts + quality flags")),
    h("h2", {}, "Uploads per year (all channels)"), h("div", { class: "panel" }, columns(s.by_year.map(y => ({ l: y.y, v: y.n })), { name: "uploads per year" })),
    h("h2", {}, "Video types"), h("div", { class: "panel" }, bars(s.video_types, "video_type", "n", r => "#/videos" + qs({ type: r.video_type }))),
    h("h2", {}, "Transcripts by caption kind"), h("div", { class: "panel" }, bars(s.caption_kinds, "caption_kind", "n")),
    h("h2", {}, "Files by role"), h("div", { class: "panel" }, bars(s.roles, "role", "n", r => "#/artifacts" + qs({ role: r.role }))),
    h("h2", {}, "How complete is the analysis coverage?"), h("div", { class: "panel" },
      h("p", {}, h("b", {}, num(s.videos_with_specific_artifact)), " of ", num(s.videos), " videos are named in at least one file that covers 25 videos or fewer (a specific analysis, transcript or report). The rest appear only in bulk exports or nowhere. ",
        A("#/videos?art=1", "Browse the covered videos"), "."),
      h("p", { class: "mut" }, "A link means a file contains the video id. It does not mean the file analyses it; read the file to judge.")),
    h("h2", {}, "Source databases"), h("div", { class: "panel" }, table([{ h: "Source", f: r => r.source_id }, { h: "Video rows", r: 1, f: r => num(r.video_rows) }, { h: "Channel rows", r: 1, f: r => num(r.channel_rows) }, { h: "SHA256", cls: "hide-s", f: r => h("code", {}, r.sha256.slice(0, 16)) }], s.sources))];
}
let CH = null, chSort = ["videos", -1], chQ = "";
async function pChannels() {
  CH = CH || await api("/api/channels");
  const out = h("div", {}); const body = h("div", { class: "panel" });
  const draw = () => {
    const rowsF = CH.filter(c => !chQ || ((c.name || "") + (c.handle || "") + c.channel_id).toLowerCase().includes(chQ.toLowerCase())).sort((a, b) => ((a[chSort[0]] ?? -1) > (b[chSort[0]] ?? -1) ? 1 : -1) * chSort[1]);
    const th = (t, k, r) => ({ h: t, r, k });
    const cols = [{ h: "Channel", k: "name", f: c => A("#/channel/" + c.channel_id, c.name || c.channel_id) }, { h: "Handle", k: "handle", cls: "hide-s", f: c => c.handle || "–" },
      { h: "Subs", k: "subscribers", r: 1, f: c => num(c.subscribers) }, { h: "Videos", k: "videos", r: 1, f: c => num(c.videos) }, { h: "Views", k: "views", r: 1, f: c => num(c.views) },
      { h: "Transcripts", k: "transcripts", r: 1, cls: "hide-s", f: c => num(c.transcripts) }, { h: "Latest", k: "last_date", cls: "hide-s", f: c => c.last_date || "–" }];
    const t = table(cols, rowsF, "No channel matches."); if (t.tagName === "TABLE") t.querySelectorAll("th").forEach((el, i) => { el.className += " s"; el.onclick = () => { chSort = [cols[i].k, chSort[0] === cols[i].k ? -chSort[1] : -1]; draw(); }; });
    body.replaceChildren(t); cnt.textContent = rowsF.length + " of " + CH.length + " channels";
  };
  const cnt = h("span", { class: "mut" });
  out.append(h("h1", {}, "Channels"), h("p", { class: "sub" }, "Keyed by the YouTube channel id (UC…). Click a column to sort."),
    h("div", { class: "bar-f" }, h("input", { type: "search", placeholder: "Filter by name, handle or id", value: chQ, oninput: e => { chQ = e.target.value; draw(); } }), cnt), body);
  draw(); return out;
