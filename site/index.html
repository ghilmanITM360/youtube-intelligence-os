<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YIOS Data Browser</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--mut:#5d6672;--line:#e1e5ea;--acc:#1f5eff;--acc-bg:#e8eeff;--ok:#17803d;--warn:#a15c00;--bad:#b42318;--bar:#9db7ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101316;--panel:#171b20;--ink:#e8ebef;--mut:#98a2ae;--line:#272d34;--acc:#7da2ff;--acc-bg:#1c2a4d;--ok:#4ac17a;--warn:#e0a13a;--bad:#f1796c;--bar:#35538f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:0 16px;overflow-x:auto}
header b{margin-right:14px;white-space:nowrap}
header a{padding:14px 12px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent}
header a.on{color:var(--ink);border-bottom-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .n{font-size:24px;font-weight:600}.card .l{color:var(--mut);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
th.s{cursor:pointer}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar i{display:block;height:10px;background:var(--bar);border-radius:3px}
.bar span{min-width:130px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc-bg);color:var(--acc);white-space:nowrap}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}.tag.grey{background:var(--line);color:var(--mut)}
.bar-f{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
input[type=search]{flex:1;min-width:180px}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:560px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.pg{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--mut)}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:18px;text-align:center}
.crumbs{margin:0 0 10px;color:var(--mut);font-size:13px}
img.pv{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.thumb{width:120px;border-radius:4px;display:block}
.ch{width:100%;height:auto;display:block}.ch rect{fill:var(--acc)}.ch rect.b2{fill:var(--bar)}.ch text{fill:var(--mut);font:10px sans-serif}.ch line{stroke:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.grid2 h2{margin-top:14px}
.md h2,.md h3,.md h4{margin:18px 0 6px}.md p{margin:8px 0}.md code{background:var(--bg);padding:1px 5px;border-radius:4px;font:13px ui-monospace,Menlo,monospace}.md blockquote{margin:8px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--mut)}.md li{margin:2px 0}.md hr{border:0;border-top:1px solid var(--line)}
.tbl{max-height:640px;overflow:auto}.tbl th{position:sticky;top:0;background:var(--panel)}.tbl td{max-width:420px;min-width:70px;overflow-wrap:break-word}.tbl.w td:first-child{min-width:300px}.tbl.w table{min-width:900px}
.jt details{margin-left:16px}.jt summary{cursor:pointer;list-style-position:outside}.jt .k{color:var(--acc)}.jt .v{margin-left:16px;word-break:break-word}.jt{font:13px/1.6 ui-monospace,Menlo,monospace}
.ch circle{fill:var(--acc);fill-opacity:.55;stroke:var(--acc);stroke-width:.5}.ch circle.c1{fill:var(--warn);stroke:var(--warn)}.ch circle.c2{fill:var(--ok);stroke:var(--ok)}.ch circle.c3{fill:var(--mut);stroke:var(--mut)}.ch circle:hover{fill-opacity:1;stroke-width:2}.ch .med{stroke:var(--warn);stroke-dasharray:4 3}.ch .heat{fill:var(--acc)}.ch .heat0{fill:var(--line)}
.spark{display:block;width:90px;height:22px}.spark rect{fill:var(--bar)}.spark rect.l{fill:var(--acc)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}.gal a{display:block;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.gal a:hover{text-decoration:none;border-color:var(--acc)}.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}.gal div{padding:6px 9px;font-size:13px}.gal b{display:block;line-height:1.3;max-height:2.6em;overflow:hidden}.gal span{color:var(--mut)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:0 0 6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--acc)}.leg i.c1{background:var(--warn)}.leg i.c2{background:var(--ok)}.leg i.c3{background:var(--mut)}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}.pbar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:6px 0 18px}.tabs a{padding:9px 14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs a.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}.tabs a:hover{text-decoration:none;color:var(--ink)}
details.tx{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:9px 12px}details.tx>summary{cursor:pointer}details.tx[open]>summary{margin-bottom:8px}.snip{color:var(--mut);font-size:13.5px;margin-top:3px}mark{background:#ffd54a;color:#111;border-radius:2px;padding:0 1px}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0}.seg button.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
@media (max-width:640px){main{padding:14px 12px 50px}.hide-s{display:none}}
</style>
</head>
